services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: learnforge
      POSTGRES_USER: learnforge
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnforge"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/learnforge
      DB_USER: learnforge
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8081}
      CORS_ORIGINS: ${APP_PUBLIC_URL:-http://localhost:8081}

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  dbdata:
