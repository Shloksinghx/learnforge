server:
  port: 8080
spring:
  application:
    name: learnforge
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learnforge}
    username: ${DB_USER:learnforge}
    password: ${DB_PASSWORD:learnforge}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}          # required, at least 32 characters
    ttl-minutes: ${JWT_TTL_MINUTES:480}
ai:
  gemini:
    api-key: ${GEMINI_API_KEY}     # required
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    model: ${GEMINI_MODEL:gemini-2.5-flash}   # verify the current model name in Google AI Studio
